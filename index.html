function Logo(){
  return h('a',{href:'#home',className:'flex shrink-0 items-center','aria-label':'كلين برو، الرئيسية'},
    h('img',{src:LOGO,alt:'شعار كلين برو لخدمات التنظيف',width:492,height:292,className:'block h-14 w-auto rounded-xl sm:h-16'}));
}
function Btn(p){
  const base='inline-flex min-h-[48px] items-center justify-center gap-2 rounded-xl px-5 py-3 font-semibold transition hover:-translate-y-0.5 ';
  const tone=p.tone==='wa'?'bg-wa text-white':p.tone==='ghost'?'border border-line bg-surface text-ink':p.tone==='light'?'bg-white text-deep':'bg-brand text-brandink';
  return h('a',{href:p.href,onClick:p.onClick,target:p.external?'_blank':undefined,rel:p.external?'noopener noreferrer':undefined,className:base+tone+' '+(p.className||'')},p.children);
}
function Head(p){
  return h('div',{className:'mx-auto mb-10 max-w-2xl text-center'},
    h('p',{className:'mb-2 text-sm font-semibold text-brand'},p.kicker),
    h('h2',{className:'font-display text-3xl font-bold text-balance sm:text-4xl'},p.title),
    p.text?h('p',{className:'mt-3 text-muted'},p.text):null);
}

function Header(){
  const [open,setOpen]=useState(false);
  const links=NAV.map(n=>h('a',{key:n[0],href:'#'+n[0],onClick:()=>setOpen(false),className:'rounded-lg px-3 py-2 text-sm font-medium text-ink transition hover:bg-soft'},n[1]));
  return h('header',{className:'sticky z-50 mt-3',style:{top:'calc(env(safe-area-inset-top, 0px) + 8px)'}},
    h('div',{className:'rounded-2xl border border-line bg-surface px-4 py-3 shadow-sm'},
      h('div',{className:'flex items-center justify-between gap-3'},
        h(Logo),
        h('nav',{className:'hidden items-center gap-1 lg:flex','aria-label':'التنقل الرئيسي'},links),
        h('div',{className:'flex items-center gap-2'},
          h(Btn,{href:'#contact',className:'hidden sm:inline-flex !min-h-[44px] !py-2'},'احجز الآن'),
          h('button',{type:'button',onClick:()=>setOpen(!open),'aria-expanded':open,'aria-label':open?'إغلاق القائمة':'فتح القائمة',className:'grid h-11 w-11 place-items-center rounded-xl border border-line text-ink lg:hidden'},h(Icon,{n:open?'x':'menu'})))),
      open?h('nav',{className:'mt-3 flex flex-col gap-1 border-t border-line pt-3 lg:hidden','aria-label':'قائمة الجوال'},links,h(Btn,{href:'#contact',onClick:()=>setOpen(false),className:'mt-2'},'احجز الآن')):null));
}

function Hero(){
  const chips=[['home','نأتيك إلى بيتك أو مكتبك'],['shield','مواد آمنة للعائلة'],['wrench','معدات احترافية تحافظ على قماشك وألوانه']];
  return h('section',{id:'home','aria-labelledby':'hero-title',className:'hero-bg mt-4 overflow-hidden rounded-[2rem] border border-line px-5 py-10 sm:px-10 lg:py-14'},
    h('div',{className:'grid items-center gap-10 lg:grid-cols-2'},
      h('div',{className:'min-w-0'},
        h('h1',{id:'hero-title',className:'font-display text-4xl font-bold leading-[1.3] text-balance sm:text-5xl'},
          'نظافة منزلك تبدأ من هنا',
          h('span',{className:'mt-2 block text-brand'},'خبراء التنظيف في عمّان')),
        h('p',{className:'mt-5 max-w-xl text-lg leading-8 text-muted'},'ننظف الكنب والسجاد والستائر بالبخار، ونزيل أصعب البقع ونعقم القطعة في موقعك. معاينة وسعر واضح قبل أن نبدأ.'),
        h('div',{className:'mt-7 flex flex-wrap gap-3'},

          h(Btn,{href:'#contact',tone:'ghost'},'اطلب عرض سعر',h(Icon,{n:'arrow'}))),
        h('ul',{className:'mt-8 flex flex-wrap gap-x-6 gap-y-3 p-0 text-sm text-muted',style:{listStyle:'none'}},
          chips.map(c=>h('li',{key:c[0],className:'flex items-center gap-2'},h('span',{className:'text-brand'},h(Icon,{n:c[0],size:18})),c[1])))),
      h('div',{className:'min-w-0 rounded-3xl border border-line bg-surface p-3 shadow-sm sm:p-4'},
        h(Photo,{}))));
}

function About(){

  return h('section',{id:'about','aria-labelledby':'about-title',className:'mt-20'},

      h('article',{className:'min-w-0'},
        h('p',{className:'mb-2 text-sm font-semibold text-brand'},'من نحن'),

        h('div',null,

        h('p',{className:'font-display text-xl font-bold',dir:'ltr',style:{textAlign:'right'}},'Clean Pro'),
        h('p',{className:'mt-2 text-sm leading-7 opacity-80'},'كلين برو لخدمات التنظيف في عمّان: كنب، سجاد، ستائر، وتعقيم.')),
      h('nav',{'aria-label':'روابط سريعة'},
        h('p',{className:'mb-3 font-semibold'},'روابط سريعة'),
        h('ul',{className:'m-0 grid grid-cols-2 gap-2 p-0 text-sm',style:{listStyle:'none'}},NAV.map(n=>h('li',{key:n[0]},h('a',{href:'#'+n[0],className:'opacity-80 transition hover:opacity-100'},n[1]))))),
      h('div',null,
        h('p',{className:'mb-3 font-semibold'},'تابعنا'),
        h('div',{className:'flex gap-3'},
          h('a',{href:FB,target:'_blank',rel:'noopener noreferrer','aria-label':'فيسبوك',className:'grid h-11 w-11 place-items-center rounded-xl bg-white text-deep'},h(Icon,{n:'fb'})),
          h('a',{href:IG,target:'_blank',rel:'noopener noreferrer','aria-label':'إنستغرام',className:'grid h-11 w-11 place-items-center rounded-xl bg-white text-deep'},h(Icon,{n:'ig'}))),
        h('p',{className:'mt-4 text-sm opacity-80',dir:'ltr',style:{textAlign:'right'}},PHONE))),
    h('p',{className:'mt-8 border-t border-white/20 pt-5 text-sm opacity-70'},'© '+year+' كلين برو Clean Pro. جميع الحقوق محفوظة.'));
}

function WhatsAppFab(){
  return h('a',{href:waLink('مرحباً كلين برو، أرغب بالاستفسار عن خدمات التنظيف وعرض سعر.'),target:'_blank',rel:'noopener noreferrer','aria-label':'تواصل معنا عبر واتساب',
    className:'fixed z-50 flex h-14 items-center gap-2 rounded-full bg-wa px-5 font-semibold text-white shadow-xl transition hover:-translate-y-1',
    style:{left:'calc(16px + env(safe-area-inset-left, 0px))',bottom:'calc(16px + env(safe-area-inset-bottom, 0px))'}},
    h(Icon,{n:'chat',size:24}),h('span',{className:'hidden sm:inline'},'واتساب'));
}

function App(){
  const [preset,setPreset]=useState({service:SERVICE_OPTIONS[0],n:0});
  const book=s=>setPreset(p=>({service:s,n:p.n+1}));
  return h(React.Fragment,null,
    h('div',{className:'mx-auto max-w-6xl'},h(Header)),
    h('main',{className:'mx-auto max-w-6xl'},h(Hero),h(About),h(Services),h(Gallery),h(Pricing,{onBook:book}),h(Faq),h(Contact,{preset:preset})),
    h('div',{className:'mx-auto max-w-6xl'},h(Footer)),
    h(WhatsAppFab));
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App));
})();
</script>
